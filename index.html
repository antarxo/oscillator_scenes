<title>ΑΑΤ — ταλαντωτής (m,k), κυκλικό μοντέλο και αρχική φάση</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:#17232d;background:#eef3f6}
*{box-sizing:border-box} html,body{margin:0;min-height:100%;background:#eef3f6}
body{display:grid;place-items:center;padding:10px}
.app{position:relative;width:min(100%,900px);display:grid;grid-template-rows:auto auto;background:#fff;border:1px solid #bac8d2;border-radius:12px;overflow:hidden;box-shadow:0 8px 28px #26384624}
.stage-wrap{position:relative;width:100%;aspect-ratio:5/3;background:linear-gradient(#fbfdfe,#f2f6f8)}
body.horizontal{padding:0;background:#fff}
body.horizontal .app{width:100%;height:100%;display:grid;grid-template-rows:minmax(0,1fr) auto;border:0;border-radius:0;box-shadow:none}
body.horizontal .stage-wrap{aspect-ratio:auto;min-height:0;height:100%}
body.horizontal #phaseBtn,body.horizontal #nowBtn,body.horizontal #phasePanel{display:none!important}
body.horizontal .controls{min-height:40px;padding:6px 9px;gap:5px}

body.horizontal button.hidden-control{display:none!important}
canvas{display:block;width:100%;height:100%}
.phase-panel{position:absolute;left:12px;bottom:12px;z-index:6;display:none;align-items:center;gap:9px;width:min(58%,430px);padding:7px 10px;border:1px solid #26323d;border-radius:10px;background:#101821e8;box-shadow:0 5px 18px #0004,inset 0 1px 0 #ffffff18;color:#e9f2f8;font-size:12px}
.phase-panel.visible{display:flex}.phase-panel label{font-weight:800;white-space:nowrap}.phase-panel input{flex:1;min-width:90px;accent-color:#4aa3d8}.phase-value{min-width:44px;text-align:right;font-weight:850;color:#91d7ff}
.controls{min-height:46px;display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap;width:100%;padding:7px 10px;border-top:1px solid #222f3a;background:#0b1118;box-shadow:inset 0 1px 0 #ffffff10}
button{appearance:none;min-width:34px;height:28px;border:1px solid #2f3c48;background:#151d26;color:#e9f2f8;border-radius:999px;padding:0 10px;font:800 12px/1 system-ui;cursor:pointer;box-shadow:inset 0 1px 0 #ffffff12}
button:hover{background:#1d2a35;border-color:#5f8fb0} button.active{background:#14597a;color:#fff;border-color:#60add9;box-shadow:0 0 0 1px #2a9bd64d,inset 0 1px 0 #ffffff22} button.primary{min-width:42px;background:#202b36;border-color:#4c5d6d;color:#fff}
button:disabled{opacity:.42;cursor:not-allowed}@media(max-width:680px){button{font-size:12px;padding:8px 9px}.controls{gap:5px}.phase-panel{font-size:12px}}

<body>
<main class="app" id="app">
  <section class="stage-wrap" id="stageWrap">
    <canvas id="scene" width="900" height="540" aria-label="Σκηνή απλής αρμονικής ταλάντωσης"></canvas>
    <div class="phase-panel" id="phasePanel">
      <label for="phaseRange">Αρχική φάση φ₀</label>
      <input id="phaseRange" type="range" min="0" max="359" step="1" value="90">
      <span class="phase-value" id="phaseValue">90°</span>
    </div>
  </section>
  <nav class="controls" aria-label="Χειριστήρια σκηνής">
    <button id="resetBtn" title="Επαναφορά">|◀</button>
    <button id="playBtn" class="primary" title="Έναρξη / παύση">⏸</button>
    <button id="axisBtn" title="Άξονας / θέση">Άξ.</button>
    <button id="circleBtn" title="Κυκλικό μοντέλο / ταχύτητα">Κύκ.</button>
    <button id="projectionBtn" title="Προβολή / επιτάχυνση">Προβ.</button>
    <button id="graphBtn" title="Γράφημα / ενέργειες">Γρ.</button>
    <button id="phaseBtn" title="Αρχική φάση">φ₀</button>
    <button id="nowBtn" title="Τώρα → t=0">t₀</button>
  </nav>
</main>
<script>
(() => {
'use strict';
const canvas=document.getElementById('scene'),ctx=canvas.getContext('2d');
const ids=['playBtn','resetBtn','axisBtn','circleBtn','projectionBtn','graphBtn','phaseBtn','nowBtn','phasePanel','phaseRange','phaseValue'];
const els=Object.fromEntries(ids.map(id=>[id,document.getElementById(id)]));
const params=new URLSearchParams(location.search);
const presets={
 spring:{horizontal:false,axis:false,circle:false,projection:false,graph:false,phaseMode:false,showPosition:false,showVelocity:false,showAcceleration:false,showForce:false,showEnergy:false,showClock:true},
 spring_axis:{horizontal:false,axis:true,circle:false,projection:false,graph:false,phaseMode:false,showPosition:false,showVelocity:false,showAcceleration:false,showForce:false,showEnergy:false,showClock:true},
 spring_circle:{horizontal:false,axis:true,circle:true,projection:false,graph:false,phaseMode:false,showPosition:false,showVelocity:false,showAcceleration:false,showForce:false,showEnergy:false,showClock:true},
 spring_projection:{horizontal:false,axis:true,circle:true,projection:true,graph:false,phaseMode:false,showPosition:false,showVelocity:false,showAcceleration:false,showForce:false,showEnergy:false,showClock:true},
 spring_graph:{horizontal:false,axis:true,circle:true,projection:true,graph:true,phaseMode:false,showPosition:false,showVelocity:false,showAcceleration:false,showForce:false,showEnergy:false,showClock:true},
 spring_phase:{horizontal:false,axis:true,circle:true,projection:true,graph:true,phaseMode:true,showPosition:false,showVelocity:false,showAcceleration:false,showForce:false,showEnergy:false,showClock:true},
 body_axis:{horizontal:true,axis:true,circle:false,projection:false,graph:false,phaseMode:false,showPosition:true,showVelocity:false,showAcceleration:false,showForce:false,showEnergy:false,showClock:true},
 body_axis_position_time:{horizontal:true,axis:true,circle:false,projection:false,graph:false,phaseMode:false,showPosition:true,showVelocity:false,showAcceleration:false,showForce:false,showEnergy:false,showClock:true},
 body_axis_position_velocity:{horizontal:true,axis:true,circle:false,projection:false,graph:false,phaseMode:false,showPosition:true,showVelocity:true,showAcceleration:false,showForce:false,showEnergy:false,showClock:true},
 body_axis_position_velocity_acceleration:{horizontal:true,axis:true,circle:false,projection:false,graph:false,phaseMode:false,showPosition:true,showVelocity:true,showAcceleration:true,showForce:false,showEnergy:false,showClock:true}
};
const initialPhiDeg=Number.isFinite(+params.get('phi'))?((+params.get('phi')%360)+360)%360:90;
const state={running:params.get('play')!=='0',horizontal:false,axis:false,circle:false,projection:false,graph:false,phaseMode:false,showPosition:false,showVelocity:false,showAcceleration:false,showForce:false,showEnergy:false,showClock:true,t:0,last:performance.now(),period:4,amplitude:92,phi0:initialPhiDeg*Math.PI/180,transition:1};
function normalizeAngle(a){const two=2*Math.PI;return ((a%two)+two)%two}
function boolParam(name,fallback){if(!params.has(name))return fallback;const v=String(params.get(name)).toLowerCase();return v==='1'||v==='true'||v==='yes'||v==='on'}
function applyQueryFlags(){for(const key of ['showPosition','showVelocity','showAcceleration','showForce','showEnergy','showClock'])if(params.has(key))state[key]=boolParam(key,state[key]);if(params.has('t')&&Number.isFinite(+params.get('t')))state.t=+params.get('t')}
function allowedControls(){return new Set(String(params.get('allowedControls')||'togglePosition,toggleVelocity,toggleAcceleration,toggleEnergy').split(',').map(s=>s.trim()).filter(Boolean))}
function applyPreset(name){Object.assign(state,presets[name]||presets.spring);applyQueryFlags();state.transition=0;if(params.has('play'))state.running=params.get('play')!=='0';updateButtons()}
applyPreset(params.get('state')||params.get('preset')||'spring');
function setFlag(key,val){state[key]=val;
 if(key==='projection'&&val){state.circle=true;state.axis=true}
 if(key==='graph'&&val){state.circle=true;state.projection=true;state.axis=true}
 if(key==='phaseMode'&&val){state.circle=true;state.projection=true;state.graph=true;state.axis=true}
 if(key==='circle'&&!val){state.projection=false;state.graph=false;state.phaseMode=false}
 if(key==='projection'&&!val){state.graph=false;state.phaseMode=false}
 if(key==='graph'&&!val){state.phaseMode=false}
 state.transition=0;updateButtons();
}
function updateButtons(){
 els.playBtn.textContent=state.running?'⏸':'▶';
 document.body.classList.toggle('horizontal',state.horizontal);
 if(state.horizontal&&canvas.height!==260){canvas.width=900;canvas.height=260}
 if(!state.horizontal&&canvas.height!==540){canvas.width=900;canvas.height=540}
 els.axisBtn.textContent=state.horizontal?'x':'Άξ.';
 els.circleBtn.textContent=state.horizontal?'υ':'Κύκ.';
 els.projectionBtn.textContent=state.horizontal?'α':'Προβ.';
 els.graphBtn.textContent=state.horizontal?'E':'Γρ.';
 els.axisBtn.title=state.horizontal?'Εμφάνιση θέσης x':'Εμφάνιση άξονα αναφοράς';
 els.circleBtn.title=state.horizontal?'Εμφάνιση ταχύτητας υ':'Εμφάνιση κυκλικού μοντέλου';
 els.projectionBtn.title=state.horizontal?'Εμφάνιση επιτάχυνσης α':'Εμφάνιση προβολής';
 els.graphBtn.title=state.horizontal?'Εμφάνιση ενεργειών':'Εμφάνιση γραφήματος x(t)';
 if(state.horizontal){
  const allowed=allowedControls();
  els.axisBtn.classList.toggle('hidden-control',!allowed.has('togglePosition'));
  els.circleBtn.classList.toggle('hidden-control',!allowed.has('toggleVelocity'));
  els.projectionBtn.classList.toggle('hidden-control',!allowed.has('toggleAcceleration'));
  els.graphBtn.classList.toggle('hidden-control',!allowed.has('toggleEnergy'));
 }else for(const button of [els.axisBtn,els.circleBtn,els.projectionBtn,els.graphBtn])button.classList.remove('hidden-control');
 if(state.horizontal){
  els.axisBtn.classList.toggle('active',state.showPosition);
  els.circleBtn.classList.toggle('active',state.showVelocity);
  els.projectionBtn.classList.toggle('active',state.showAcceleration);
  els.graphBtn.classList.toggle('active',state.showEnergy);
 }else for(const k of ['axis','circle','projection','graph'])els[k+'Btn'].classList.toggle('active',state[k]);
 els.phaseBtn.classList.toggle('active',state.phaseMode);els.phasePanel.classList.toggle('visible',state.phaseMode);
 els.projectionBtn.disabled=state.horizontal?false:!state.circle;els.graphBtn.disabled=state.horizontal?false:!state.projection;els.phaseBtn.disabled=!state.graph;els.nowBtn.disabled=!state.circle;
 const deg=Math.round(normalizeAngle(state.phi0)*180/Math.PI)%360;els.phaseRange.value=String(deg);els.phaseValue.textContent=`${deg}°`;
}
els.playBtn.onclick=()=>{state.running=!state.running;state.last=performance.now();updateButtons()};
els.resetBtn.onclick=()=>{state.t=0;state.phi0=Math.PI/2;state.running=false;state.last=performance.now();updateButtons()};
els.axisBtn.onclick=()=>state.horizontal?(state.showPosition=!state.showPosition,updateButtons()):setFlag('axis',!state.axis);
els.circleBtn.onclick=()=>state.horizontal?(state.showVelocity=!state.showVelocity,updateButtons()):setFlag('circle',!state.circle);
els.projectionBtn.onclick=()=>state.horizontal?(state.showAcceleration=!state.showAcceleration,updateButtons()):setFlag('projection',!state.projection);
els.graphBtn.onclick=()=>state.horizontal?(state.showEnergy=!state.showEnergy,updateButtons()):setFlag('graph',!state.graph);
els.phaseBtn.onclick=()=>setFlag('phaseMode',!state.phaseMode);
els.nowBtn.onclick=()=>{state.phi0=normalizeAngle(2*Math.PI*state.t/state.period+state.phi0);state.t=0;state.phaseMode=true;state.last=performance.now();updateButtons()};
els.phaseRange.addEventListener('input',()=>{state.phi0=Number(els.phaseRange.value)*Math.PI/180;state.t=0;state.running=false;state.phaseMode=true;state.last=performance.now();updateButtons()});

function lerp(a,b,u){return a+(b-a)*u}function ease(u){return u<.5?2*u*u:1-Math.pow(-2*u+2,2)/2}
function line(x1,y1,x2,y2,stroke='#263b48',w=2,dash=[]){ctx.save();ctx.strokeStyle=stroke;ctx.lineWidth=w;ctx.setLineDash(dash);ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();ctx.restore()}
function text(s,x,y,size=16,align='center',color='#17232d',weight=600){ctx.save();ctx.fillStyle=color;ctx.font=`${weight} ${size}px system-ui`;ctx.textAlign=align;ctx.textBaseline='middle';ctx.fillText(s,x,y);ctx.restore()}
function drawArrow(x,y,dy,color='#16845c'){line(x,y,x,y+dy,color,2.4);ctx.save();ctx.fillStyle=color;ctx.beginPath();const sy=Math.sign(dy)||1;ctx.moveTo(x,y+dy);ctx.lineTo(x-5,y+dy-8*sy);ctx.lineTo(x+5,y+dy-8*sy);ctx.closePath();ctx.fill();ctx.restore()}
function drawSpring(x,top,bottom){const coils=18,amp=13;ctx.save();ctx.strokeStyle='#526978';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(x,top);for(let i=1;i<=coils;i++){const y=top+(bottom-top)*i/coils;ctx.lineTo(x+(i%2?amp:-amp),y)}ctx.lineTo(x,bottom);ctx.stroke();ctx.restore();text('k',x+25,(top+bottom)/2,17,'left','#344b59',750)}
function drawMass(x,y){ctx.save();ctx.fillStyle='#3c92b7';ctx.strokeStyle='#174d68';ctx.lineWidth=3;ctx.beginPath();ctx.roundRect(x-27,y-22,54,44,7);ctx.fill();ctx.stroke();ctx.restore();text('m',x,y,18,'center','#fff',800)}
function drawAxis(x,cy,A){line(x,cy-A-22,x,cy+A+22,'#60727e',1.5);line(x-7,cy-A,x+7,cy-A);line(x-7,cy,x+7,cy);line(x-7,cy+A,x+7,cy+A);text('+A',x-12,cy-A,15,'right');text('0',x-12,cy,15,'right');text('−A',x-12,cy+A,15,'right')}
function drawPhaseArc(cx,cy,A,phi0){const r=Math.min(46,A*.52),end=-normalizeAngle(phi0);ctx.save();ctx.strokeStyle='#a56a1f';ctx.lineWidth=2;ctx.setLineDash([4,3]);ctx.beginPath();ctx.arc(cx,cy,r,0,end,true);ctx.stroke();ctx.restore();const mid=end/2;text('φ₀',cx+(r+13)*Math.cos(mid),cy+(r+13)*Math.sin(mid),15,'center','#8c5818',800)}
function drawCircle(cx,cy,A,phase,phi0,phaseMode){ctx.save();ctx.strokeStyle='#506773';ctx.lineWidth=2;ctx.beginPath();ctx.arc(cx,cy,A,0,Math.PI*2);ctx.stroke();ctx.restore();line(cx-A-15,cy,cx+A+15,cy,'#a4b1b8',1);line(cx,cy-A-15,cx,cy+A+15,'#a4b1b8',1);
 if(phaseMode){const ix=cx+A*Math.cos(phi0),iy=cy-A*Math.sin(phi0);line(cx,cy,ix,iy,'#a56a1f',1.7,[5,4]);ctx.save();ctx.fillStyle='rgba(198,62,55,.22)';ctx.strokeStyle='rgba(198,62,55,.45)';ctx.lineWidth=1.4;ctx.beginPath();ctx.arc(ix,iy,10,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.restore();text('t=0',ix+14,iy-14,12,'left','#a1473f',700);drawPhaseArc(cx,cy,A,phi0)}
 const px=cx+A*Math.cos(phase),py=cy-A*Math.sin(phase);line(cx,cy,px,py,'#16845c',3);ctx.fillStyle='#c63e37';ctx.beginPath();ctx.arc(px,py,9,0,Math.PI*2);ctx.fill();return{px,py};}
function drawGraph(x,y,w,A,phase,phi0,t,period){line(x,y-A-18,x,y+A+18);line(x,y,x+w,y);text('x',x-9,y-A-15,15);text('t',x+w+10,y+12,15);line(x,y-A,x+w,y-A,'#aebbc2',1,[4,4]);line(x,y+A,x+w,y+A,'#aebbc2',1,[4,4]);text('+A',x-7,y-A,13,'right');text('−A',x-7,y+A,13,'right');text('0',x-7,y,13,'right');
 const n=Math.floor(Math.max(0,t)/period),cycle=((t%period)+period)%period,frac=cycle/period;
 text(`(${n}T, 0)`,x-3,y+19,12,'left','#334d5b',700);text(`${n+1}T`,x+w,y+19,12,'center','#334d5b',700);
 ctx.save();ctx.strokeStyle='#8da3b2';ctx.globalAlpha=.58;ctx.lineWidth=2;ctx.beginPath();for(let i=0;i<=180;i++){const u=i/180,xx=x+u*w,yy=y-A*Math.sin(u*Math.PI*2+phi0);i?ctx.lineTo(xx,yy):ctx.moveTo(xx,yy)}ctx.stroke();ctx.restore();
 ctx.save();ctx.strokeStyle='#226b92';ctx.lineWidth=3;ctx.beginPath();const nPoints=Math.max(1,Math.floor(180*frac));for(let i=0;i<=nPoints;i++){const u=i/180,xx=x+u*w,yy=y-A*Math.sin(u*Math.PI*2+phi0);i?ctx.lineTo(xx,yy):ctx.moveTo(xx,yy)}ctx.stroke();ctx.restore();
 const px=x+frac*w,py=y-A*Math.sin(phase),yFinal=y-A*Math.sin(phi0);line(x+w,yFinal,x+w,y,'#8da3b2',1,[3,3]);return{px,py,x0:x,y0:y-A*Math.sin(phi0)};}
function drawCurrentPoint(x,y,r=6,color='#c63e37'){ctx.save();ctx.fillStyle=color;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();ctx.restore()}
function drawOutlinePoint(x,y,r=7,color='#a56a1f'){ctx.save();ctx.strokeStyle=color;ctx.lineWidth=2;ctx.setLineDash([4,3]);ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.stroke();ctx.restore()}
function drawGhostMass(x,y){ctx.save();ctx.strokeStyle='#a56a1f';ctx.lineWidth=1.8;ctx.setLineDash([5,4]);ctx.beginPath();ctx.roundRect(x-27,y-22,54,44,7);ctx.stroke();ctx.restore();text('t=0',x+34,y-28,12,'left','#8c5818',700)}
function drawPhaseReadout(phi0,omega,A){const deg=Math.round(normalizeAngle(phi0)*180/Math.PI)%360,x0=Math.sin(phi0),v0=Math.cos(phi0),dir=Math.abs(v0)<.015?'υ₀ = 0':v0>0?'υ₀ > 0':'υ₀ < 0';ctx.save();ctx.fillStyle='#ffffffed';ctx.strokeStyle='#c7d2da';ctx.lineWidth=1.2;ctx.beginPath();ctx.roundRect(328,62,244,94,9);ctx.fill();ctx.stroke();ctx.restore();text(`φ₀ = ${deg}°`,343,80,14,'left','#176a89',800);text(`x₀/A = ${x0.toFixed(2)}`,343,102,13,'left','#334d5b',700);text(dir,343,123,13,'left','#334d5b',700);text('x=A·ημ(ωt+φ₀)',343,145,13,'left','#334d5b',750)}
function drawArrowXY(x1,y1,x2,y2,color='#16845c',label=''){line(x1,y1,x2,y2,color,2.6);ctx.save();ctx.fillStyle=color;const a=Math.atan2(y2-y1,x2-x1);ctx.beginPath();ctx.moveTo(x2,y2);ctx.lineTo(x2-9*Math.cos(a-.45),y2-9*Math.sin(a-.45));ctx.lineTo(x2-9*Math.cos(a+.45),y2-9*Math.sin(a+.45));ctx.closePath();ctx.fill();ctx.restore();if(label)text(label,x2+(x2>=x1?16:-16),y2-13,15,x2>=x1?'left':'right',color,850)}
function drawHorizontal(){
 const now=performance.now(),dt=Math.min(.05,(now-state.last)/1000);state.last=now;if(state.running)state.t+=dt;const W=canvas.width,H=canvas.height,cy=Math.round(H*.52),origin=Math.round(W*.5),A=Math.min(220,W*.32),omega=2*Math.PI/state.period,phase=omega*state.t+state.phi0,x=A*Math.sin(phase),v=A*Math.cos(phase),acc=-x;
 ctx.clearRect(0,0,W,H);ctx.fillStyle='#f8fbfc';ctx.fillRect(0,0,W,H);line(origin-A-55,cy,origin+A+55,cy,'#60727e',2);drawArrowXY(origin+A+37,cy,origin+A+57,cy,'#60727e','x');
 for(const [mark,label] of [[-1,'−A'],[-.5,''],[0,'0'],[.5,''],[1,'+A']]){const px=origin+mark*A;line(px,cy-9,px,cy+9,'#93a4af',1.4);if(label)text(label,px,cy+25,13,'center','#526978',750)}
 line(origin+x,cy-58,origin+x,cy+54,'#b7c5ce',1.2,[5,5]);if(state.showPosition)drawArrowXY(origin,cy+42,origin+x,cy+42,'#226b92','x');if(state.showVelocity&&Math.abs(v)>4)drawArrowXY(origin+x,cy-32,origin+x+Math.sign(v)*Math.min(Math.abs(v)*.5,105),cy-32,'#16845c','υ');if(state.showAcceleration&&Math.abs(acc)>4)drawArrowXY(origin+x,cy-56,origin+x+Math.sign(acc)*Math.min(Math.abs(acc)*.5,105),cy-56,'#c63e37','α');if(state.showForce&&Math.abs(acc)>4)drawArrowXY(origin+x,cy+66,origin+x+Math.sign(acc)*Math.min(Math.abs(acc)*.42,92),cy+66,'#8a4ab8','ΣF');
 ctx.save();ctx.fillStyle='#3c92b7';ctx.strokeStyle='#174d68';ctx.lineWidth=3;ctx.beginPath();ctx.roundRect(origin+x-28,cy-23,56,46,8);ctx.fill();ctx.stroke();ctx.restore();text('m',origin+x,cy,18,'center','#fff',850);
 if(state.showClock){ctx.save();ctx.fillStyle='#ffcc00';ctx.strokeStyle='#5f4c00';ctx.lineWidth=1.2;ctx.beginPath();ctx.roundRect(18,14,126,32,6);ctx.fill();ctx.stroke();ctx.restore();text(`t = ${state.t.toFixed(2)} s`,81,31,14,'center','#17232d',800)}
 if(state.showEnergy){const k=(x/A)**2,kin=1-k,bx=W-142,by=18;for(const [i,name,val,color] of [[0,'U',k,'#c63e37'],[1,'K',kin,'#16845c']]){text(name,bx,by+i*23+6,12,'left','#334d5b',800);ctx.fillStyle='#dfe7ed';ctx.fillRect(bx+18,by+i*23,96,12);ctx.fillStyle=color;ctx.fillRect(bx+18,by+i*23,96*Math.max(0,Math.min(1,val)),12)}}
 text('Οριζόντια ΑΑΤ σώματος',origin,H-28,15,'center','#334d5b',750);requestAnimationFrame(draw);
}
function draw(){
 if(state.horizontal){drawHorizontal();return}
 const now=performance.now(),dt=Math.min(.05,(now-state.last)/1000);state.last=now;if(state.running)state.t+=dt;state.transition=Math.min(1,state.transition+dt*2.4);const u=ease(state.transition);
