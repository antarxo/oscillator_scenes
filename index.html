<title>ΑΑΤ — ταλαντωτής (m,k), κυκλικό μοντέλο και αρχική φάση</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:#17232d;background:#fff}
*{box-sizing:border-box} html,body{margin:0;width:100%;height:100%;min-height:0;background:#fff;overflow:hidden}
body{display:grid;place-items:stretch;padding:0}
.app{position:relative;width:100%;height:100%;display:grid;grid-template-rows:minmax(0,1fr) auto auto;background:#fff;border:0;border-radius:0;overflow:hidden;box-shadow:none}
.stage-wrap{position:relative;width:100%;height:100%;min-height:0;background:linear-gradient(#fbfdfe,#f2f6f8);overflow:hidden;cursor:pointer}
body.horizontal{padding:0;background:#fff}

body.horizontal .stage-wrap{aspect-ratio:auto;min-height:0;height:100%}

.phase-panel.visible{display:flex}.phase-panel label{font-weight:800;white-space:nowrap}.phase-panel input{flex:1;min-width:80px;accent-color:#4aa3d8}.phase-value{min-width:38px;text-align:right;font-weight:850;color:#91d7ff}
.controls{min-height:clamp(30px,8.5vh,46px);display:flex;align-items:center;justify-content:center;gap:clamp(3px,1vw,6px);flex-wrap:wrap;width:100%;padding:clamp(4px,1.6vh,7px) clamp(6px,2vw,10px);border-top:1px solid #222f3a;background:#0b1118;box-shadow:inset 0 1px 0 #ffffff10}
button{appearance:none;min-width:clamp(26px,6vw,34px);height:clamp(22px,5.5vh,28px);border:1px solid #2f3c48;background:#151d26;color:#e9f2f8;border-radius:999px;padding:0 clamp(6px,1.8vw,10px);font:800 clamp(10px,2.2vw,12px)/1 system-ui;cursor:pointer;box-shadow:inset 0 1px 0 #ffffff12}
button:hover{background:#1d2a35;border-color:#5f8fb0} button.active{background:#14597a;color:#fff;border-color:#60add9;box-shadow:0 0 0 1px #2a9bd64d,inset 0 1px 0 #ffffff22} button.primary{min-width:clamp(32px,7vw,42px);background:#202b36;border-color:#4c5d6d;color:#fff}

<body>
<main class="app" id="app">
  <section class="stage-wrap" id="stageWrap">
    <canvas id="scene" width="900" height="540" aria-label="Σκηνή απλής αρμονικής ταλάντωσης"></canvas>
  </section>
  <div class="phase-panel" id="phasePanel">
    <label for="phaseRange">Αρχική φάση φ₀</label>
    <input id="phaseRange" type="range" min="0" max="359" step="1" value="90">
    <span class="phase-value" id="phaseValue">90°</span>
  </div>
  <nav class="controls" aria-label="Χειριστήρια σκηνής">
    <button id="resetBtn" title="Επαναφορά">|◀</button>
    <button id="playBtn" class="primary" title="Έναρξη / παύση">⏸</button>
    <button id="axisBtn" title="Άξονας / θέση">x↕</button>
    <button id="circleBtn" title="Κυκλικό μοντέλο / ταχύτητα">φ↻</button>
    <button id="projectionBtn" title="Προβολή / επιτάχυνση">⊥x</button>
    <button id="graphBtn" title="Γράφημα / ενέργειες">x(t)</button>
    <button id="phaseBtn" title="Αρχική φάση">φ₀</button>
    <button id="nowBtn" title="Τώρα → t=0">t→0</button>
  </nav>
</main>
<script>
(() => {
'use strict';
const canvas=document.getElementById('scene'),ctx=canvas.getContext('2d');
const ids=['playBtn','resetBtn','axisBtn','circleBtn','projectionBtn','graphBtn','phaseBtn','nowBtn','phasePanel','phaseRange','phaseValue'];
const els=Object.fromEntries(ids.map(id=>[id,document.getElementById(id)]));
const params=new URLSearchParams(location.search);
const sceneTextSize=Number.isFinite(+params.get('textSize'))?Math.max(8,Math.min(18,+params.get('textSize'))):11;
const presets={
 spring:{horizontal:false,axis:false,circle:false,projection:false,graph:false,phaseMode:false,showPosition:false,showVelocity:false,showAcceleration:false,showForce:false,showEnergy:false,showClock:true},
 spring_axis:{horizontal:false,axis:true,circle:false,projection:false,graph:false,phaseMode:false,showPosition:false,showVelocity:false,showAcceleration:false,showForce:false,showEnergy:false,showClock:true},
 spring_circle:{horizontal:false,axis:true,circle:true,projection:false,graph:false,phaseMode:false,showPosition:false,showVelocity:false,showAcceleration:false,showForce:false,showEnergy:false,showClock:true},
 spring_projection:{horizontal:false,axis:true,circle:true,projection:true,graph:false,phaseMode:false,showPosition:false,showVelocity:false,showAcceleration:false,showForce:false,showEnergy:false,showClock:true},
 spring_graph:{horizontal:false,axis:true,circle:true,projection:true,graph:true,phaseMode:false,showPosition:false,showVelocity:false,showAcceleration:false,showForce:false,showEnergy:false,showClock:true},
 spring_phase:{horizontal:false,axis:true,circle:true,projection:true,graph:true,phaseMode:true,showPosition:false,showVelocity:false,showAcceleration:false,showForce:false,showEnergy:false,showClock:true},
 body_axis:{horizontal:true,axis:true,circle:false,projection:false,graph:false,phaseMode:false,showPosition:true,showVelocity:false,showAcceleration:false,showForce:false,showEnergy:false,showClock:true},
 body_axis_position_time:{horizontal:true,axis:true,circle:false,projection:false,graph:false,phaseMode:false,showPosition:true,showVelocity:false,showAcceleration:false,showForce:false,showEnergy:false,showClock:true},
 body_axis_position_velocity:{horizontal:true,axis:true,circle:false,projection:false,graph:false,phaseMode:false,showPosition:true,showVelocity:true,showAcceleration:false,showForce:false,showEnergy:false,showClock:true},
 body_axis_position_velocity_acceleration:{horizontal:true,axis:true,circle:false,projection:false,graph:false,phaseMode:false,showPosition:true,showVelocity:true,showAcceleration:true,showForce:false,showEnergy:false,showClock:true}
};
const initialPhiDeg=Number.isFinite(+params.get('phi'))?((+params.get('phi')%360)+360)%360:90;
const state={running:params.get('play')!=='0',horizontal:false,axis:false,circle:false,projection:false,graph:false,phaseMode:false,showPosition:false,showVelocity:false,showAcceleration:false,showForce:false,showEnergy:false,showClock:true,t:0,last:performance.now(),period:4,amplitude:92,phi0:initialPhiDeg*Math.PI/180,transition:1};
function normalizeAngle(a){const two=2*Math.PI;return ((a%two)+two)%two}
function boolParam(name,fallback){if(!params.has(name))return fallback;const v=String(params.get(name)).toLowerCase();return v==='1'||v==='true'||v==='yes'||v==='on'}
function applyQueryFlags(){for(const key of ['showPosition','showVelocity','showAcceleration','showForce','showEnergy','showClock'])if(params.has(key))state[key]=boolParam(key,state[key]);if(params.has('t')&&Number.isFinite(+params.get('t')))state.t=+params.get('t')}
function allowedControls(){return new Set(String(params.get('allowedControls')||'togglePosition,toggleVelocity,toggleAcceleration,toggleEnergy').split(',').map(s=>s.trim()).filter(Boolean))}
function applyPreset(name){Object.assign(state,presets[name]||presets.spring);applyQueryFlags();state.transition=0;if(params.has('play'))state.running=params.get('play')!=='0';updateButtons()}
applyPreset(params.get('state')||params.get('preset')||'spring');
function setFlag(key,val){state[key]=val;
 if(key==='projection'&&val){state.circle=true;state.axis=true}
 if(key==='graph'&&val){state.circle=true;state.projection=true;state.axis=true}
 if(key==='phaseMode'&&val){state.circle=true;state.projection=true;state.graph=true;state.axis=true}
 if(key==='circle'&&!val){state.projection=false;state.graph=false;state.phaseMode=false}
 if(key==='projection'&&!val){state.graph=false;state.phaseMode=false}
 if(key==='graph'&&!val){state.phaseMode=false}
 state.transition=0;updateButtons();
}
function updateButtons(){
 els.playBtn.textContent=state.running?'⏸':'▶';
 document.body.classList.toggle('horizontal',state.horizontal);
 els.axisBtn.textContent=state.horizontal?'x':'x↕';
 els.circleBtn.textContent=state.horizontal?'υ':'φ↻';
 els.projectionBtn.textContent=state.horizontal?'α':'⊥x';
 els.graphBtn.textContent=state.horizontal?'E':'x(t)';
 els.nowBtn.textContent='t→0';
 els.axisBtn.title=state.horizontal?'Εμφάνιση θέσης x':'Εμφάνιση άξονα αναφοράς x';
 els.circleBtn.title=state.horizontal?'Εμφάνιση ταχύτητας υ':'Εμφάνιση κυκλικού μοντέλου / φάσης';
 els.projectionBtn.title=state.horizontal?'Εμφάνιση επιτάχυνσης α':'Εμφάνιση προβολής στον άξονα x';
 els.graphBtn.title=state.horizontal?'Εμφάνιση ενεργειών':'Εμφάνιση γραφήματος x(t)';
 if(state.horizontal){
  const allowed=allowedControls();
  els.axisBtn.classList.toggle('hidden-control',!allowed.has('togglePosition'));
  els.circleBtn.classList.toggle('hidden-control',!allowed.has('toggleVelocity'));
  els.projectionBtn.classList.toggle('hidden-control',!allowed.has('toggleAcceleration'));
  els.graphBtn.classList.toggle('hidden-control',!allowed.has('toggleEnergy'));
 }else for(const button of [els.axisBtn,els.circleBtn,els.projectionBtn,els.graphBtn])button.classList.remove('hidden-control');
 if(state.horizontal){
  els.axisBtn.classList.toggle('active',state.showPosition);
  els.circleBtn.classList.toggle('active',state.showVelocity);
  els.projectionBtn.classList.toggle('active',state.showAcceleration);
  els.graphBtn.classList.toggle('active',state.showEnergy);
 }else for(const k of ['axis','circle','projection','graph'])els[k+'Btn'].classList.toggle('active',state[k]);
 els.phaseBtn.classList.toggle('active',state.phaseMode);els.phasePanel.classList.toggle('visible',state.phaseMode);
 els.projectionBtn.disabled=state.horizontal?false:!state.circle;els.graphBtn.disabled=state.horizontal?false:!state.projection;els.phaseBtn.disabled=!state.graph;els.nowBtn.disabled=!state.circle;
 const deg=Math.round(normalizeAngle(state.phi0)*180/Math.PI)%360;els.phaseRange.value=String(deg);els.phaseValue.textContent=`${deg}°`;
}
function syncCanvasSize(){
 const rect=canvas.getBoundingClientRect();
 const fallbackH=state.horizontal?260:360;
 const width=Math.max(220,Math.round(rect.width||canvas.clientWidth||canvas.width||900));
 const minHeight=state.horizontal?64:120;
 const height=Math.max(minHeight,Math.round(rect.height||canvas.clientHeight||canvas.height||fallbackH));
 if(canvas.width!==width)canvas.width=width;
 if(canvas.height!==height)canvas.height=height;
 return{W:width,H:height};
}
function toggleRunning(){state.running=!state.running;state.last=performance.now();updateButtons()}
els.playBtn.onclick=toggleRunning;
document.getElementById('stageWrap').onclick=toggleRunning;
els.resetBtn.onclick=()=>{state.t=0;state.phi0=Math.PI/2;state.running=false;state.last=performance.now();updateButtons()};
els.axisBtn.onclick=()=>state.horizontal?(state.showPosition=!state.showPosition,updateButtons()):setFlag('axis',!state.axis);
els.circleBtn.onclick=()=>state.horizontal?(state.showVelocity=!state.showVelocity,updateButtons()):setFlag('circle',!state.circle);
els.projectionBtn.onclick=()=>state.horizontal?(state.showAcceleration=!state.showAcceleration,updateButtons()):setFlag('projection',!state.projection);
els.graphBtn.onclick=()=>state.horizontal?(state.showEnergy=!state.showEnergy,updateButtons()):setFlag('graph',!state.graph);
els.phaseBtn.onclick=()=>setFlag('phaseMode',!state.phaseMode);
els.nowBtn.onclick=()=>{state.phi0=normalizeAngle(2*Math.PI*state.t/state.period+state.phi0);state.t=0;state.phaseMode=true;state.last=performance.now();updateButtons()};
els.phaseRange.addEventListener('input',()=>{state.phi0=Number(els.phaseRange.value)*Math.PI/180;state.t=0;state.running=false;state.phaseMode=true;state.last=performance.now();updateButtons()});

function lerp(a,b,u){return a+(b-a)*u}function ease(u){return u<.5?2*u*u:1-Math.pow(-2*u+2,2)/2}
function displayScale(){return 1}
function visualScale(){return Math.max(.78,Math.min(1.18,canvas.width/706))}
function objectScale(){return Math.max(.66,Math.min(1.12,canvas.width/706))}
function scaledDash(dash=[]){return Array.isArray(dash)?dash.map(v=>v*visualScale()):dash}
function line(x1,y1,x2,y2,stroke='#263b48',w=2,dash=[]){ctx.save();ctx.strokeStyle=stroke;ctx.lineWidth=w*visualScale();ctx.setLineDash(scaledDash(dash));ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();ctx.restore()}
function textSize(size){return Math.max(size,sceneTextSize/displayScale())}
function textFamily(){return 'Calibri, "Segoe UI", Arial, sans-serif'}
function text(s,x,y,size=16,align='center',color='#17232d',weight=600){ctx.save();ctx.fillStyle=color;ctx.font=`${weight} ${textSize(size)}px ${textFamily()}`;ctx.textAlign=align;ctx.textBaseline='middle';ctx.fillText(s,x,y);ctx.restore()}
function textWidth(s,size=16,weight=600){ctx.save();ctx.font=`${weight} ${textSize(size)}px ${textFamily()}`;const w=ctx.measureText(String(s)).width;ctx.restore();return w}
function drawTextBox(label,x,y,size=14,opts={}){
 const weight=opts.weight??800,padX=opts.padX??14,padY=opts.padY??8,w=Math.max(opts.minWidth??0,textWidth(label,size,weight)+padX*2),h=Math.max(opts.minHeight??0,textSize(size)+padY*2);
 ctx.save();ctx.fillStyle=opts.fill??'#ffcc00';ctx.strokeStyle=opts.stroke??'#5f4c00';ctx.lineWidth=(opts.lineWidth??1.2)*visualScale();ctx.beginPath();ctx.roundRect(x,y,w,h,(opts.radius??6)*objectScale());ctx.fill();ctx.stroke();ctx.restore();text(label,x+w/2,y+h/2,size,'center',opts.color??'#17232d',weight);return{w,h}
}
function drawArrow(x,y,dy,color='#16845c'){const os=objectScale();line(x,y,x,y+dy,color,2.4);ctx.save();ctx.fillStyle=color;ctx.beginPath();const sy=Math.sign(dy)||1;ctx.moveTo(x,y+dy);ctx.lineTo(x-5*os,y+dy-8*os*sy);ctx.lineTo(x+5*os,y+dy-8*os*sy);ctx.closePath();ctx.fill();ctx.restore()}
function drawSpring(x,top,bottom){const os=objectScale(),coils=18,amp=13*os;ctx.save();ctx.strokeStyle='#526978';ctx.lineWidth=4*visualScale();ctx.beginPath();ctx.moveTo(x,top);for(let i=1;i<=coils;i++){const y=top+(bottom-top)*i/coils;ctx.lineTo(x+(i%2?amp:-amp),y)}ctx.lineTo(x,bottom);ctx.stroke();ctx.restore();text('k',x+25*os,(top+bottom)/2,17,'left','#344b59',750)}
function drawMass(x,y){const os=objectScale(),w=54*os,h=44*os;ctx.save();ctx.fillStyle='#3c92b7';ctx.strokeStyle='#174d68';ctx.lineWidth=3*visualScale();ctx.beginPath();ctx.roundRect(x-w/2,y-h/2,w,h,7*os);ctx.fill();ctx.stroke();ctx.restore();text('m',x,y,18,'center','#fff',800)}
function drawAxis(x,cy,A){const os=objectScale(),tick=7*os;line(x,cy-A-22*os,x,cy+A+22*os,'#60727e',1.5);line(x-tick,cy-A,x+tick,cy-A);line(x-tick,cy,x+tick,cy);line(x-tick,cy+A,x+tick,cy+A);text('+A',x-12*os,cy-A,15,'right');text('0',x-12*os,cy,15,'right');text('−A',x-12*os,cy+A,15,'right')}
function drawPhaseArc(cx,cy,A,phi0){const os=objectScale(),r=Math.min(46*os,A*.52),end=-normalizeAngle(phi0);ctx.save();ctx.strokeStyle='#a56a1f';ctx.lineWidth=2*visualScale();ctx.setLineDash(scaledDash([4,3]));ctx.beginPath();ctx.arc(cx,cy,r,0,end,true);ctx.stroke();ctx.restore();const mid=end/2;text('φ₀',cx+(r+13*os)*Math.cos(mid),cy+(r+13*os)*Math.sin(mid),15,'center','#8c5818',800)}
function drawCircle(cx,cy,A,phase,phi0,phaseMode){ctx.save();ctx.strokeStyle='#506773';ctx.lineWidth=2*visualScale();ctx.beginPath();ctx.arc(cx,cy,A,0,Math.PI*2);ctx.stroke();ctx.restore();line(cx-A-15,cy,cx+A+15,cy,'#a4b1b8',1);line(cx,cy-A-15,cx,cy+A+15,'#a4b1b8',1);
 if(phaseMode){const os=objectScale(),ix=cx+A*Math.cos(phi0),iy=cy-A*Math.sin(phi0);line(cx,cy,ix,iy,'#a56a1f',1.7,[5,4]);ctx.save();ctx.fillStyle='rgba(198,62,55,.22)';ctx.strokeStyle='rgba(198,62,55,.45)';ctx.lineWidth=1.4*visualScale();ctx.beginPath();ctx.arc(ix,iy,10*os,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.restore();text('t=0',ix+14*os,iy-14*os,12,'left','#a1473f',700);drawPhaseArc(cx,cy,A,phi0)}
 const os=objectScale(),px=cx+A*Math.cos(phase),py=cy-A*Math.sin(phase);line(cx,cy,px,py,'#16845c',3);ctx.fillStyle='#c63e37';ctx.beginPath();ctx.arc(px,py,9*os,0,Math.PI*2);ctx.fill();return{px,py};}
function drawGraph(x,y,w,A,phase,phi0,t,period){line(x,y-A-18,x,y+A+18);line(x,y,x+w,y);text('x',x-9,y-A-15,15);text('t',x+w+10,y+12,15);line(x,y-A,x+w,y-A,'#aebbc2',1,[4,4]);line(x,y+A,x+w,y+A,'#aebbc2',1,[4,4]);text('+A',x-7,y-A,13,'right');text('−A',x-7,y+A,13,'right');text('0',x-7,y,13,'right');
 const n=Math.floor(Math.max(0,t)/period),cycle=((t%period)+period)%period,frac=cycle/period;
 text(`(${n}T, 0)`,x-3,y+19,12,'left','#334d5b',700);text(`${n+1}T`,x+w,y+19,12,'center','#334d5b',700);
 ctx.save();ctx.strokeStyle='#8da3b2';ctx.globalAlpha=.58;ctx.lineWidth=2*visualScale();ctx.beginPath();for(let i=0;i<=180;i++){const u=i/180,xx=x+u*w,yy=y-A*Math.sin(u*Math.PI*2+phi0);i?ctx.lineTo(xx,yy):ctx.moveTo(xx,yy)}ctx.stroke();ctx.restore();
 ctx.save();ctx.strokeStyle='#226b92';ctx.lineWidth=3*visualScale();ctx.beginPath();const nPoints=Math.max(1,Math.floor(180*frac));for(let i=0;i<=nPoints;i++){const u=i/180,xx=x+u*w,yy=y-A*Math.sin(u*Math.PI*2+phi0);i?ctx.lineTo(xx,yy):ctx.moveTo(xx,yy)}ctx.stroke();ctx.restore();
 const px=x+frac*w,py=y-A*Math.sin(phase),yFinal=y-A*Math.sin(phi0);line(x+w,yFinal,x+w,y,'#8da3b2',1,[3,3]);return{px,py,x0:x,y0:y-A*Math.sin(phi0)};}
function drawCurrentPoint(x,y,r=6,color='#c63e37'){ctx.save();ctx.fillStyle=color;ctx.beginPath();ctx.arc(x,y,r*objectScale(),0,Math.PI*2);ctx.fill();ctx.restore()}
function drawOutlinePoint(x,y,r=7,color='#a56a1f'){ctx.save();ctx.strokeStyle=color;ctx.lineWidth=2*visualScale();ctx.setLineDash(scaledDash([4,3]));ctx.beginPath();ctx.arc(x,y,r*objectScale(),0,Math.PI*2);ctx.stroke();ctx.restore()}
function drawGhostMass(x,y){const os=objectScale(),w=54*os,h=44*os;ctx.save();ctx.strokeStyle='#a56a1f';ctx.lineWidth=1.8*visualScale();ctx.setLineDash(scaledDash([5,4]));ctx.beginPath();ctx.roundRect(x-w/2,y-h/2,w,h,7*os);ctx.stroke();ctx.restore();text('t=0',x+34*os,y-28*os,12,'left','#8c5818',700)}
function drawPhaseReadout(phi0,omega,A,x=36,y=40){
 const deg=Math.round(normalizeAngle(phi0)*180/Math.PI)%360,x0=Math.sin(phi0),v0=Math.cos(phi0),dir=Math.abs(v0)<.015?'υ₀ = 0':v0>0?'υ₀ > 0':'υ₀ < 0';
 const rows=[
  {value:`φ₀ = ${deg}°`,size:13,color:'#176a89',weight:800},
  {value:`x₀/A = ${x0.toFixed(2)}`,size:12,color:'#334d5b',weight:700},
  {value:dir,size:12,color:'#334d5b',weight:700},
  {value:'x=A·ημ(ωt+φ₀)',size:12,color:'#334d5b',weight:750}
 ];
 const padX=11,padY=8,lineGap=17,w=Math.max(184,Math.max(...rows.map(row=>textWidth(row.value,row.size,row.weight)))+padX*2),h=Math.max(72,padY*2+(rows.length-1)*lineGap+textSize(13));
 ctx.save();ctx.fillStyle='#ffffffed';ctx.strokeStyle='#c7d2da';ctx.lineWidth=1.2;ctx.beginPath();ctx.roundRect(x,y,w,h,9);ctx.fill();ctx.stroke();ctx.restore();
 rows.forEach((row,index)=>text(row.value,x+padX,y+padY+textSize(13)/2+index*lineGap,row.size,'left',row.color,row.weight));
}
function drawArrowXY(x1,y1,x2,y2,color='#16845c',label='',opts={}){
 const width=opts.width??3.2,head=(opts.head??11)*objectScale();line(x1,y1,x2,y2,color,width);ctx.save();ctx.fillStyle=color;const a=Math.atan2(y2-y1,x2-x1);ctx.beginPath();ctx.moveTo(x2,y2);ctx.lineTo(x2-head*Math.cos(a-.45),y2-head*Math.sin(a-.45));ctx.lineTo(x2-head*Math.cos(a+.45),y2-head*Math.sin(a+.45));ctx.closePath();ctx.fill();ctx.restore();
 if(label){const back=opts.labelBack??18,dy=opts.labelYOffset??-15,lx=x2-Math.cos(a)*back,ly=y2-Math.sin(a)*back+dy;text(label,lx,ly,opts.labelSize??15,'center',color,900)}
}

 {const label=`t = ${state.t.toFixed(2)} s`,w=Math.max(116,textWidth(label,14,800)+28);drawTextBox(label,W/2-w/2,Math.max(8,top-8),14,{minWidth:116,minHeight:32});}
 const compactLabels=W<560;
